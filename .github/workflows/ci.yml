name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package agent release
        run: npm run package -w @openrmm/agent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-release
          path: packages/agent/release/openrmm-agent-*.zip
          if-no-files-found: error

  docker:
    name: Publish Docker image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Per-platform agent packages: each OS bundles its own native terminal
  # binaries into the release zip.
  package-platforms:
    name: Package agent (${{ matrix.suffix }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
          - os: macos-latest
            suffix: macos
          - os: ubuntu-latest
            suffix: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package -w @openrmm/agent
      - name: Rename with platform suffix
        shell: bash
        run: |
          mv packages/agent/release/openrmm-agent-v*.zip \
             packages/agent/release/openrmm-agent-v0.1.0-${{ matrix.suffix }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.suffix }}
          path: packages/agent/release/openrmm-agent-v*-${{ matrix.suffix }}.zip
          if-no-files-found: error

  release:
    name: GitHub release (tags only)
    needs: package-platforms
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages/agent/release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/agent/release/openrmm-agent-*.zip
          generate_release_notes: true
